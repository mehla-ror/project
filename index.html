<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad-Free Music App</title>
<style>
body{margin:0;font-family:-apple-system;background:#121212;color:white;display:flex;flex-direction:column;align-items:center;padding:20px;}
h1{color:#ff0000;margin-bottom:20px;}
#searchBar{display:flex;width:100%;max-width:600px;margin-bottom:20px;}
#searchBar input{flex:1;padding:10px;border-radius:20px;border:none;font-size:16px;}
#searchBar button{padding:10px 20px;margin-left:10px;border:none;background:#ff0000;color:white;border-radius:20px;cursor:pointer;font-size:16px;}
#results{display:flex;flex-direction:column;gap:10px;width:100%;max-width:600px;margin-bottom:20px;}
.result{background:#1e1e1e;padding:10px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;}
.result button{padding:6px 12px;border:none;background:#ff0000;color:white;border-radius:12px;cursor:pointer;}
#playlist{width:100%;max-width:600px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.song{background:#1e1e1e;padding:10px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;}
#audioPlayer{width:100%;max-width:600px;margin-top:20px;border-radius:12px;outline:none;background:#222;padding:10px;}
#controls{display:flex;justify-content:space-between;margin-top:10px;}
button.control{padding:8px 16px;border:none;border-radius:12px;background:#ff0000;color:white;cursor:pointer;}
</style>
</head>
<body>

<h1>Ad-Free Music App</h1>

<div id="searchBar">
  <input id="query" placeholder="Search for a song...">
  <button onclick="search()">Search</button>
</div>

<div id="results"></div>

<h2>Playlist</h2>
<div id="playlist"></div>

<audio id="audioPlayer" controls></audio>
<div id="controls">
  <button class="control" onclick="prev()">⏮️ Previous</button>
  <button class="control" onclick="next()">⏭️ Next</button>
</div>

<!-- Hidden YouTube iframe to play audio only -->
<iframe id="ytframe" style="display:none;"></iframe>

<script>
let playlist = [];
let currentIndex = -1;

async function search(){
  const q = document.getElementById("query").value.trim();
  if(!q) return alert("Enter a song name");

  const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=5&q=${encodeURIComponent(q)}&key=YOUR_API_KEY`);
  const data = await res.json();

  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  data.items.forEach(item=>{
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `<span>${item.snippet.title}</span>
                     <button onclick="addToPlaylist('${item.id.videoId}','${item.snippet.title}')">Add</button>`;
    resultsDiv.appendChild(div);
  });
}

function addToPlaylist(videoId,title){
  playlist.push({videoId,title});
  renderPlaylist();
}

function renderPlaylist(){
  const plDiv = document.getElementById("playlist");
  plDiv.innerHTML = "";
  playlist.forEach((s,i)=>{
    const div = document.createElement("div");
    div.className = "song";
    div.innerHTML = `<span>${s.title}</span>
                     <div>
                       <button onclick="playIndex(${i})">Play</button>
                       <button onclick="removeSong(${i})">Remove</button>
                     </div>`;
    plDiv.appendChild(div);
  });
}

function playIndex(i){
  currentIndex = i;
  const videoId = playlist[i].videoId;
  playAudio(videoId);
}

function playAudio(videoId){
  // Use hidden iframe for audio only
  const url = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${videoId}`;
  document.getElementById("ytframe").src = url;
}

function removeSong(index){
  playlist.splice(index,1);
  if(index===currentIndex) currentIndex=-1;
  renderPlaylist();
}

function next(){
  if(playlist.length===0) return;
  currentIndex = (currentIndex + 1) % playlist.length;
  playIndex(currentIndex);
}

function prev(){
  if(playlist.length===0) return;
  currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
  playIndex(currentIndex);
}
</script>

</body>
</html>
