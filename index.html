<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Weather Chat</title>

<style>
body{margin:0;font-family:-apple-system;background:#f0f2f5}
#weather,#chat,#admin{display:none;height:100vh}
iframe{width:100%;height:100%;border:none}
#search{position:fixed;top:15px;right:15px;font-size:22px;background:#fff;padding:10px;border-radius:50%;cursor:pointer}
#chatHeader{background:#0084ff;color:#fff;padding:12px;font-weight:bold}
#messages{height:calc(100vh - 110px);overflow-y:auto;padding:10px}
.msg{margin:6px 0;padding:10px;border-radius:16px;max-width:70%}
.me{background:#0084ff;color:#fff;margin-left:auto}
.other{background:#fff}
#input{display:flex;padding:8px;background:#fff}
#input input{flex:1;border:none;padding:10px;border-radius:20px;background:#eee}
#input button{border:none;background:#0084ff;color:#fff;margin-left:6px;border-radius:50%;padding:10px}
#pinned{background:#e7f3ff;padding:8px;margin:6px;border-radius:10px;display:none}
pre{white-space:pre-wrap;padding:10px}
</style>
</head>

<body>

<div id="weather">
  <div id="search">🔐</div>
  <iframe src="https://wttr.in/?format=3"></iframe>
</div>

<div id="chat">
  <div id="chatHeader">Secret Chat</div>
  <div id="pinned"></div>
  <div id="messages"></div>
  <div id="input">
    <input id="text" placeholder="Type message...">
    <button onclick="send()">➤</button>
  </div>
</div>

<div id="admin">
  <div id="chatHeader">Admin Panel</div>
  <pre id="log"></pre>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
/* 🔥 FIREBASE CONFIG */
firebase.initializeApp({
  apiKey: "AIzaSyClDpYNMrZMCBFlAYjFHdWAJRvTlpmRjds",
  databaseURL: "https://secret-app-c988f-default-rtdb.firebaseio.com"
});
const db = firebase.database();
const msgRef = db.ref("messages");
const pinRef = db.ref("pinned");

/* 🔐 AUTH */
const auth = sessionStorage.getItem("auth");
const user = sessionStorage.getItem("user") || "Guest";

document.getElementById("search").onclick = () => {
  const code = prompt("Enter secret code");
  if(code==="BAG@777"){
    sessionStorage.setItem("auth","user");
    sessionStorage.setItem("user",prompt("Your name")||"Guest");
    startChat();
  } 
  else if(code==="JAMESON@420"){
    sessionStorage.setItem("auth","admin");
    startAdmin();
  }
};

if(auth==="user") startChat();
else if(auth==="admin") startAdmin();
else showWeather();

function showWeather(){
  weather.style.display="block";
}

/* 💬 CHAT */
function startChat(){
  weather.style.display="none";
  chat.style.display="block";

  msgRef.limitToLast(50).on("child_added", s=>{
    const m=s.val();
    const d=document.createElement("div");
    d.className="msg "+(m.user===user?"me":"other");
    d.innerText=m.user+": "+m.text;
    messages.appendChild(d);
    messages.scrollTop=messages.scrollHeight;
  });

  pinRef.on("value", s=>{
    if(s.val()){
      pinned.style.display="block";
      pinned.innerText="📌 "+s.val().text;
    } else pinned.style.display="none";
  });
}

function send(){
  if(!text.value) return;
  msgRef.push({user,text:text.value,time:Date.now()});
  text.value="";
}

/* 👑 ADMIN */
function startAdmin(){
  weather.style.display="none";
  admin.style.display="block";
  msgRef.on("value", s=>{
    log.innerText = JSON.stringify(s.val(),null,2);
  });
}
</script>
</body>
</html>
