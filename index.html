<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Music Player</title>
<style>
body{margin:0;font-family:-apple-system;background:#f0f2f5;display:flex;flex-direction:column;align-items:center;padding:20px;}
h1{color:#ff0000;text-align:center;}
#searchBar{display:flex;width:100%;max-width:600px;margin-bottom:20px;}
#searchBar input{flex:1;padding:10px;border-radius:20px;border:1px solid #ccc;font-size:16px;}
#searchBar button{padding:10px 20px;margin-left:10px;border:none;background:#ff0000;color:white;border-radius:20px;cursor:pointer;font-size:16px;}
#results{display:flex;flex-direction:column;gap:15px;width:100%;max-width:600px;}
.result{background:white;padding:10px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.result button{padding:6px 12px;border:none;background:#ff0000;color:white;border-radius:12px;cursor:pointer;}
iframe{width:100%;height:360px;border:none;margin-top:20px;border-radius:12px;}
</style>
</head>
<body>

<h1>YouTube Music Player</h1>

<div id="searchBar">
  <input id="query" placeholder="Search for a song...">
  <button onclick="search()">Search</button>
</div>

<div id="results"></div>

<div id="player"></div>

<script>
async function search(){
  const query = document.getElementById("query").value;
  if(!query) return alert("Enter song name");
  const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=5&q=${encodeURIComponent(query)}&key=YOUR_API_KEY`);
  const data = await res.json();
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";
  data.items.forEach(item => {
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `<span>${item.snippet.title}</span><button onclick="play('${item.id.videoId}')">Play</button>`;
    resultsDiv.appendChild(div);
  });
}

function play(videoId){
  document.getElementById("player").innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
}
</script>

</body>
</html>
