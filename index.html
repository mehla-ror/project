<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Message</title>
<style>
body { font-family: sans-serif; background:#f0f2f5; display:flex; flex-direction:column; align-items:center; padding:20px;}
h2 { color:#0088cc; }
form, .admin-login { width:100%; max-width:400px; margin-top:20px; }
input, textarea { width:100%; padding:8px; margin-bottom:10px; border-radius:6px; border:1px solid #ccc; }
button { padding:10px 20px; border-radius:6px; background:#0088cc; color:white; border:none; cursor:pointer; }
pre { background:#e7f3ff; padding:10px; border-radius:6px; overflow:auto; max-height:300px; }
</style>
</head>
<body>

<h2>Hey 👋</h2>
<p>Send me an anonymous message</p>

<form id="msgForm">
  <input id="name" placeholder="Your name" required />
  <textarea id="msg" placeholder="Your message" required></textarea>
  <button type="submit">Send</button>
</form>

<hr style="margin:20px 0; width:100%; max-width:400px;">

<div class="admin-login">
  <h3>Admin Login</h3>
  <input id="adminPass" type="password" placeholder="Password" />
  <button id="loginBtn">Login</button>
</div>

<pre id="adminMessages" style="display:none;"></pre>

<script>
let messages = []; // store messages in memory
const ADMIN_PASSWORD = "YOUR_ADMIN_PASSWORD"; // replace with secure password

// Send message
document.getElementById("msgForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const name = document.getElementById("name").value;
  const msg = document.getElementById("msg").value;

  // Fetch IP using free API
  let ip = "Unknown";
  try {
    const res = await fetch("https://api.ipify.org?format=json");
    const data = await res.json();
    ip = data.ip;
  } catch(e){}

  messages.push({name, msg, ip, time:new Date().toLocaleString()});
  alert("Message sent ❤️");
  this.reset();
});

// Admin login
document.getElementById("loginBtn").addEventListener("click", function(){
  const pass = document.getElementById("adminPass").value;
  if(pass === ADMIN_PASSWORD){
    document.getElementById("adminMessages").style.display = "block";
    document.getElementById("adminMessages").textContent = JSON.stringify(messages,null,2);
  } else {
    alert("Wrong password!");
  }
});
</script>

</body>
</html>
